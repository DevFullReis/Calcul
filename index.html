<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de OV - Supabase</title>
    <!-- Importando o cliente do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
        }
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #3ecf8e; /* Cor padrão do Supabase */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #34b27b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fa;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Consulta de Ordens de Venda (OV)</h2>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Digite o número da OV ou FERTL...">
        <button onclick="consultarOV()">Consultar</button>
    </div>

    <div id="errorMsg" class="error"></div>

    <table id="resultTable">
        <thead>
            <tr>
                <th>Fert</th>
                <th>Assembly</th>
                <th>Cor</th>
                <th>OV</th>
                <th>Qtd</th>
                <th>Validado</th>
                <th>Container</th>
                <th>Lacre</th>
                <th>Data</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td colspan="9" style="text-align: center;">Nenhum dado consultado ainda.</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // 1. Substitua com as suas credenciais do painel do Supabase (Project Settings > API)
    const SUPABASE_URL = 'https://lbttcrnayppkzaiibclk.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxidHRjcm5heXBwa3phaWliY2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NTI3NDQsImV4cCI6MjA2NzEyODc0NH0.sAR8jZMqoiNeLlV7cVEcKxEz3vObrPv4-APmTI3_97g';

    // Inicializa o cliente do Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function consultarOV() {
        const termo = document.getElementById('searchInput').value.trim();
        const tableBody = document.getElementById('tableBody');
        const errorMsg = document.getElementById('errorMsg');
        
        errorMsg.textContent = '';
        tableBody.innerHTML = '<tr><td colspan="9" style="text-align: center;">Carregando...</td></tr>';

        try {
            // Constrói a consulta na tabela 'ov'
            let query = supabaseClient.from('ov').select('*');

            // Se o usuário digitou algo, filtra por OV ou Fert
            if (termo !== '') {
                query = query.or(`ov.ilike.%${termo}%,fert.ilike.%${termo}%`);
            }

            const { data, error } = await query.limit(50);

            if (error) throw error;

            // Limpa a tabela
            tableBody.innerHTML = '';

            if (!data || data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="9" style="text-align: center;">Nenhum registro encontrado.</td></tr>';
                return;
            }

            // Preenche a tabela com os resultados
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.fert}</td>
                    <td>${item.assembly}</td>
                    <td>${item.cor}</td>
                    <td>${item.ov}</td>
                    <td>${item.qntd}</td>
                    <td>${item.validado}</td>
                    <td>${item.container}</td>
                    <td>${item.lacre}</td>
                    <td>${new Date(item.data).toLocaleString('pt-BR')}</td>
                `;
                tableBody.appendChild(tr);
            });

        } catch (error) {
            console.error('Erro na consulta:', error.message);
            errorMsg.textContent = 'Erro ao consultar dados: ' + error.message;
            tableBody.innerHTML = '<tr><td colspan="9" style="text-align: center;">Erro ao carregar.</td></tr>';
        }
    }
</script>

</body>
</html>
