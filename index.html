<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busca Específica - b_data</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .search-box {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      flex: 1;
      min-width: 180px;
    }
    button {
      padding: 8px 16px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0369a1;
    }
    #status {
      font-weight: 600;
      margin-bottom: 15px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h1>Consulta por Container ou OV</h1>

  <div class="search-box">
    <input type="text" id="inputContainer" placeholder="Digite o Container (ex: CONT123)">
    <input type="text" id="inputOV" placeholder="Digite a OV (ex: OV9876)">
    <button onclick="buscar()">Pesquisar</button>
  </div>

  <div id="status">Digite um Container ou OV acima para buscar.</div>
  <div id="resultados"></div>

  <script>
    async function buscar() {
      const containerVal = document.getElementById('inputContainer').value.trim();
      const ovVal = document.getElementById('inputOV').value.trim();
      const statusEl = document.getElementById('status');
      const resultadosEl = document.getElementById('resultados');

      if (!containerVal && !ovVal) {
        statusEl.innerText = 'Preencha o campo Container ou OV para realizar a busca.';
        statusEl.style.color = '#dc2626';
        return;
      }

      statusEl.innerText = 'Consultando no servidor...';
      statusEl.style.color = '#0284c7';
      resultadosEl.innerHTML = '';

      try {
        // Monta a URL com parâmetros de busca
        const params = new URLSearchParams();
        if (containerVal) params.append('container', containerVal);
        if (ovVal) params.append('ov', ovVal);

        const resposta = await fetch(`/api/consultar?${params.toString()}`);
        const textoResposta = await resposta.text();
        let dados;

        try {
          dados = JSON.parse(textoResposta);
        } catch (e) {
          throw new Error(`Resposta do servidor inválida: ${textoResposta.substring(0, 100)}...`);
        }

        if (!resposta.ok) {
          throw new Error(dados.error || 'Erro ao realizar a consulta');
        }

        if (!dados || dados.length === 0) {
          statusEl.innerText = 'Nenhum registro encontrado para essa busca.';
          statusEl.style.color = '#64748b';
          return;
        }

        statusEl.innerText = `Sucesso! ${dados.length} registro(s) encontrado(s):`;
        statusEl.style.color = '#16a34a';

        resultadosEl.innerHTML = dados.map(item => `
          <div class="card">
            <strong>Serial:</strong> ${item.serial} | 
            <strong>FERT:</strong> ${item.fert} | 
            <strong>Cor:</strong> ${item.cor} | 
            <strong>Container:</strong> ${item.container} | 
            <strong>OV:</strong> ${item.ov} | 
            <strong>Lacre:</strong> ${item.lacre}
          </div>
        `).join('');

      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Erro: ' + err.message;
        statusEl.style.color = '#dc2626';
      }
    }
  </script>
</body>
</html>
